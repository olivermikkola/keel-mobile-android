name: Android CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  harness-and-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-35
            build-tools;35.0.0
            ndk;27.2.12479018
            cmake;3.31.6

      - name: Prepare pinned llama.cpp b12367
        run: bash scripts/prepare-llama.sh

      - name: Run harness tests
        run: ./gradlew :harness:test --no-daemon

      - name: Run Android unit & Compose UI tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build Debug APK (with native arm64-v8a & x86_64 JNI)
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: keel-mobile-android-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
